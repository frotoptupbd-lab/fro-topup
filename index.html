========================================================= */

    const container =

    if(container){

        container.scrollTo(0,0);

    }

    render();

}


/* =========================================================

========================================================= */

function render(){

    const user = getCurrentUser();

    const main =
        document.getElementById("main-content");

    const nav =
        document.getElementById("bottom-nav");

    const badge =
        document.getElementById("user-balance-badge");

    document.getElementById("shop-title").innerText =
        db.settings.shopName || "TOPUP BUZZ";


    updateSupportLinks();


    if(!user && db.currentTab !== "admin"){

        nav.classList.add("hide");

        badge.classList.add("hide");

        main.innerHTML = renderAuth();

        return;

    }


    if(user && db.currentTab !== "admin"){

        nav.classList.remove("hide");

        badge.classList.remove("hide");

        document.getElementById(
            "header-balance"
        ).innerText =
            Number(user.balance || 0).toFixed(2);

        updateNav();

        updateMessageBadge();

    }


    if(db.currentTab === "home"){

        main.innerHTML = renderHome();

    }

    else if(db.currentTab === "deposit"){

        main.innerHTML = renderDeposit();

    }

    else if(db.currentTab === "messages"){

        main.innerHTML = renderMessages();

    }

    else if(db.currentTab === "orders"){

        main.innerHTML = renderOrders();

    }

    else if(db.currentTab === "account"){

        main.innerHTML = renderAccount();

    }

    else if(db.currentTab === "admin"){

        nav.classList.add("hide");

        badge.classList.add("hide");

        main.innerHTML = renderAdmin();

    }

}

    let tg =

    if(tg.startsWith("http")){

        window.supportTelegram = tg;

    }else{

        tg = tg.replace("@","");

        window.supportTelegram =

    }

    window.supportWhatsapp =
        "https://wa.me/" +

            db.settings.whatsappNumber

/* =========================================================
   NAV ACTIVE
========================================================= */

function updateNav(){

    [
        "home",
        "deposit",
        "messages",
        "orders",
        "account"
    ].forEach(t => {

        const el =
            document.getElementById(
                "nav-" + t
            );

        if(!el) return;

        el.className =
            "text-xs text-center " +
            (
                db.currentTab === t
                ? "text-indigo-600 font-bold"
                : "text-gray-500"
            );

    });

}


/* =========================================================
   MESSAGE BADGE
========================================================= */

function updateMessageBadge(){

    const user = getCurrentUser();

    const badge =
        document.getElementById(
            "message-nav-badge"
        );

    if(!badge || !user) return;

    const unread =
        db.messages.filter(
            m =>
                Number(m.userId) === Number(user.id)
                &&
                m.sender === "admin"
                &&
                m.readByUser !== true
        ).length;

    if(unread > 0){

        badge.innerText =
            unread > 9 ? "9+" : unread;

        badge.classList.remove("hidden");

    }else{

        badge.classList.add("hidden");

    }

}

function renderAuth(){

    return `

                        ? "Customer Login"
                        : "Create New Account"
                    }
                </p>

            </div>


            <div class="mt-6 space-y-3">

                <input
                    type="text"
                    id="auth-phone"
                    placeholder="01XXXXXXXXX"
                    class="w-full border rounded-xl p-3 text-sm"
                >

                <input
                    type="password"
                    id="auth-pass"
                    placeholder="Password"
                    class="w-full border rounded-xl p-3 text-sm"
                >

                ${
                    db.authMode === "register"
                    ?
                    `
                    <input
                        type="password"
                        id="auth-conf-pass"
                        placeholder="Confirm Password"
                        class="w-full border rounded-xl p-3 text-sm"
                    >
                    `
                    :
                    ""
                }

                <button
                    onclick="handleAuth()"
                    class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm">
                    ${
                        db.authMode === "login"
                        ? "Login"
                        : "Register"
                    }
                </button>

                <button
                    onclick="toggleAuthMode()"
                    class="w-full text-indigo-600 text-xs py-2">

                    ${
                        db.authMode === "login"
                        ? "Create New Account"
                        : "Already have account? Login"
                    }

                </button>

            </div>

        </div>

    </div>

    `;

}


function toggleAuthMode(){

    db.authMode =
        db.authMode === "login"
        ? "register"
        : "login";

    render();

}


function handleAuth(){

    const phone =
        document.getElementById(
            "auth-phone"
        ).value.trim();

    const pass =
        document.getElementById(
            "auth-pass"
        ).value.trim();


    if(!/^01[0-9]{9}$/.test(phone)){

        alert(
            "সঠিক ১১ সংখ্যার ফোন নম্বর দিন"
        );

        return;

    }


    if(pass.length < 6){

        alert(
            "Password কমপক্ষে ৬ অক্ষরের হতে হবে"
        );

        return;

    }


    if(db.authMode === "register"){

        const conf =
            document.getElementById(
                "auth-conf-pass"
            ).value.trim();


        if(pass !== conf){

            alert("Password মিলছে না");

            return;

        }


        if(
            db.users.some(
                u => u.phone === phone
            )
        ){

            alert(
                "এই নম্বর দিয়ে ইতিমধ্যে অ্যাকাউন্ট রয়েছে"
            );

            return;

        }


        const user = {

            id:Date.now(),

            phone:phone,

            password:pass,

            balance:0,

            totalSpend:0,

            createdAt:new Date().toLocaleString()

        };


        db.users.push(user);

        db.currentUserId =
            user.id;

        db.currentTab =
            "home";

        saveData();

        render();

    }

    else{

        const user =
            db.users.find(
                u =>
                    u.phone === phone
                    &&
                    u.password === pass
            );


        if(!user){

            alert(
                "নম্বর অথবা পাসওয়ার্ড ভুল হয়েছে"
            );

            return;

        }


        db.currentUserId =
            user.id;

        db.currentTab =
            "home";

        saveData();

        render();

    }

}


function logout(){

    db.currentUserId = null;

    db.currentTab = "home";

    saveData();

    render();

}

========================================================= */

function clearProduct(){

    db.selectedProductId = null;

    db.orderQty = 1;

    render();

}


function changeQty(value){

    db.orderQty =
        Math.max(
            1,
            Number(value) || 1
        );


    const product =
        db.products.find(
            p =>
                Number(p.id) ===
                Number(db.selectedProductId)
        );


    if(product){

        const total =
            Number(product.price) *
            db.orderQty;


        const el =
            document.getElementById(
                "order-total"
            );


        if(el){

            el.innerText =
                "৳ " +
                total.toFixed(2);

        }

    }

}


/* =========================================================
   SUBMIT ORDER
========================================================= */

function submitOrder(){

    const user =
        getCurrentUser();


    if(!user){

        alert(
            "প্রথমে Login করুন"
        );

        return;

    }


    const product =
        db.products.find(
            p =>
                Number(p.id) ===
                Number(db.selectedProductId)
        );


    if(!product){

        alert(
            "Product নির্বাচন করুন"
        );

        return;

    }


    const target =
        document.getElementById(
            "order-target"
        ).value.trim();


    if(!target){

        alert(
            "প্রয়োজনীয় তথ্য দিন"
        );

        return;

    }


    const quantity =
        Number(db.orderQty) || 1;


    const total =
        Number(product.price) *
        quantity;


    if(
        Number(user.balance) <
        total
    ){

        alert(
            "আপনার পর্যাপ্ত Balance নেই।"
        );

        switchTab("deposit");

        return;

    }


    user.balance =
        Number(user.balance) -
        total;


    user.totalSpend =
        Number(user.totalSpend || 0) +
        total;


    const order = {

        id:Date.now(),

        userId:user.id,

        userPhone:user.phone,

        serviceName:
            getServiceName(
                product.serviceId
            ),

        productName:
            product.name,

        quantity:quantity,

        total:total,

        target:target,

        uid:
            product.inputType === "uid"
            ?
            target
            :
            "",

        link:
            product.inputType === "link"
            ?
            target
            :
            "",

        status:"Pending",

        date:
            new Date().toLocaleString()

    };


    db.orders.unshift(order);

    db.selectedProductId = null;

    db.orderQty = 1;

    saveData();

    alert(
        "অর্ডার সফলভাবে সাবমিট হয়েছে!"
    );

    render();

}

function submitDeposit(){

    const amount =
        Number(
            document.getElementById(
                "dep-amount"
            ).value
        );


    const method =
        document.getElementById(
            "dep-method"
        ).value;


    const sender =
        document.getElementById(
            "dep-sender"
        ).value.trim();


    const trx =
        document.getElementById(
            "dep-trx"
        ).value.trim();


    if(!amount || amount < 1){

        alert(
            "কমপক্ষে ৳1 Deposit করতে হবে"
        );

        return;

    }


    if(!/^01[0-9]{9}$/.test(sender)){

        alert(
            "সঠিক Sender Number দিন"
        );

        return;

    }


    if(!trx){

        alert("TrxID দিন");

        return;

    }


    const user =
        getCurrentUser();


    const deposit = {

        id:Date.now(),

        userId:user.id,

        userPhone:user.phone,

        amount:amount,

        method:method,

        senderNumber:sender,

        trxId:trx,

        status:"Pending",

        date:new Date().toLocaleString()

    };


    db.deposits.unshift(
        deposit
    );

    saveData();


    alert(
        "Deposit Request সফলভাবে জমা হয়েছে।"
    );

    switchTab("deposit");

}

function previewMessagePhoto(input){

    const file =
        input.files &&
        input.files[0];


    if(!file)
        return;


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        alert(
            "শুধুমাত্র Image নির্বাচন করুন।"
        );

        input.value = "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        function(e){

            const preview =
                document.getElementById(
                    "selected-photo-preview"
                );


            const image =
                document.getElementById(
                    "photo-preview-image"
                );


            image.src =
                e.target.result;


            preview.classList.remove(
                "hidden"
            );

        };

function sendMessage(){

    const user =
        getCurrentUser();


    const input =
        document.getElementById(
            "message-input"
        );


    const fileInput =
        document.getElementById(
            "message-photo"
        );


    const text =
        input
        ?
        input.value.trim()
        :
        "";


    const file =
        fileInput &&
        fileInput.files
        &&
        fileInput.files[0];


    if(!text && !file){

        alert(
            "Message অথবা Photo দিন"
        );

        return;

    }


    function finish(imageData){

        const message = {

            id:Date.now(),

            userId:user.id,

            userPhone:user.phone,

            category:
                db.messageCategory,

            sender:"user",

            text:text,

            image:imageData || "",

            date:
                new Date().toLocaleString(),

            readByAdmin:false,

            readByUser:true

        };


        db.messages.push(
            message
        );


        saveData();

        render();


        setTimeout(
            () => {

                const box =
                    document.getElementById(
                        "chat-box"
                    );

                if(box){

                    box.scrollTop =
                        box.scrollHeight;

                }

            },
            50
        );

    }


    if(file){

        if(
            file.size >
            2 * 1024 * 1024
        ){

            alert(
                "Image সর্বোচ্চ 2MB হতে হবে।"
            );

            return;

        }


        const reader =
            new FileReader();


        reader.onload =
            e =>
                finish(
                    e.target.result
                );


        reader.readAsDataURL(file);

    }

    else{

        finish("");

    }

}

function markAdminMessagesRead(userId){

    db.messages.forEach(

                Number(m.userId) ===
                Number(userId)
                &&
                m.sender === "user"
            ){

                m.readByAdmin = true;

            }

        }
    );


    saveData();

}

function backAdminMessages(){

    db.adminSelectedUser = null;

    render();

}


function previewAdminPhoto(input){

    const file =
        input.files &&
        input.files[0];


    if(!file)
        return;


    if(
        !file.type.startsWith(
            "image/"
        )
    ){

        alert(
            "শুধুমাত্র Image নির্বাচন করুন।"
        );

        input.value = "";

        return;

    }


    if(
        file.size >
        2 * 1024 * 1024
    ){

        alert(
            "Image সর্বোচ্চ 2MB হতে হবে।"
        );

        input.value = "";

        return;

    }


    const reader =
        new FileReader();


    reader.onload =
        e => {

            document.getElementById(
                "admin-photo-preview"
            ).src =
                e.target.result;


            document.getElementById(
                "admin-selected-photo-preview"
            ).classList.remove(
                "hidden"
            );

        };


    reader.readAsDataURL(file);

}


function sendAdminMessage(){

    const user =
        db.users.find(
            u =>
                Number(u.id) ===
                Number(db.adminSelectedUser)
        );


    if(!user)
        return;


    const input =
        document.getElementById(
            "admin-message-input"
        );


    const fileInput =
        document.getElementById(
            "admin-message-photo"
        );


    const text =
        input
        ?
        input.value.trim()
        :
        "";


    const file =
        fileInput &&
        fileInput.files
        &&
        fileInput.files[0];


    if(!text && !file){

        alert(
            "Message অথবা Photo দিন"
        );

        return;

    }


    const category =
        getUserCurrentCategory(
            user.id
        );


    function finish(imageData){

        db.messages.push({

            id:Date.now(),

            userId:user.id,

            userPhone:user.phone,

            category:category || "other",

            sender:"admin",

            text:text,

            image:imageData || "",

            date:
                new Date().toLocaleString(),

            readByAdmin:true,

            readByUser:false

        });


        saveData();

        render();

    }


    if(file){

        const reader =
            new FileReader();


        reader.onload =
            e =>
                finish(
                    e.target.result
                );


        reader.readAsDataURL(file);

    }

    else{

        finish("");

    }

}


function getUserCurrentCategory(userId){

    const list =
        db.messages.filter(
            m =>
                Number(m.userId) ===
                Number(userId)
        );


    if(list.length === 0)
        return "other";


    return list[
        list.length - 1
    ].category || "other";

}


function getMessageCategoryName(id){

    const category =
        MESSAGE_CATEGORIES.find(
            c =>
                c.id === id
        );


    return category
        ?
        category.title
        :
        "Other Problem";

}

function addService(){

        ).value.trim()

        });

/* =========================================================
   ORDER ADMIN ACTIONS
========================================================= */

function setOrderStatus(id,status){

    const order =
        db.orders.find(
            o =>
                Number(o.id) ===
                Number(id)
        );


    if(!order)
        return;


    order.status =
        status;


    if(
        status === "Cancelled"
        &&
        order.balanceRefunded !== true
    ){

        const user =
            db.users.find(
                u =>
                    Number(u.id) ===
                    Number(order.userId)
            );


        if(user){

            user.balance =
                Number(
                    user.balance || 0
                )
                +
                Number(
                    order.total || 0
                );


            user.totalSpend =
                Math.max(
                    0,
                    Number(
                        user.totalSpend || 0
                    )
                    -
                    Number(
                        order.total || 0
                    )
                );

        }


        order.balanceRefunded =
            true;

    }


    saveData();

    render();

}

    const d =

                Number(id)
        );


    if(
        !d ||
        d.status !== "Pending"
    )
        return;


    const user =
        db.users.find(
            u =>
                Number(u.id) ===
                Number(d.userId)
        );


    if(!user){

        alert(
            "User পাওয়া যায়নি"
        );

        return;

    }


    user.balance =
        Number(
            user.balance || 0
        )
        +
        Number(
            d.amount || 0
        );


    d.status =
        "Approved";


    saveData();

    render();

}


function cancelDeposit(id){

    const d =
        db.deposits.find(
            x =>
                Number(x.id) ===
                Number(id)
        );


    if(!d)
        return;


    d.status =
        "Cancelled";


    saveData();

    render();

}


/* =========================================================
   CUSTOMER BALANCE
========================================================= */

function addBalancePrompt(userId){

    const amount =
        prompt(
            "কত টাকা Balance যোগ করবেন?"
        );


    if(amount === null)
        return;


    const value =
        Number(amount);


    if(
        !value ||
        value <= 0
    ){

        alert(
            "সঠিক Amount দিন"
        );

        return;

    }


    const user =
        db.users.find(
            u =>
                Number(u.id) ===
                Number(userId)
        );


    if(!user)
        return;


    user.balance =
        Number(
            user.balance || 0
        )
        +
        value;


    saveData();

    render();

}

    db.settings.shopName =

    db.settings.paymentNumber =

        ).value.trim();

        ).value.trim();


    saveData();

    alert(

    );

    render();

}


/* =========================================================
   HELPERS
========================================================= */

function getServiceName(id){

    const s =
        db.services.find(
            x =>
                x.id === id
        );


    return s
        ?
        s.name
        :
        "";

}


function cleanNumber(number){

    return String(
        number || ""
    ).replace(
        /\D/g,
        ""
    );

}


function escapeHTML(value){

    return String(
        value ?? ""
    )
    .replace(
        /&/g,
        "&amp;"
    )
    .replace(
        /</g,
        "&lt;"
    )
    .replace(
        />/g,
        "&gt;"
    )
    .replace(
        /"/g,
        "&quot;"
    )
    .replace(
        /'/g,
        "&#039;"
    );

}


function escapeAttr(value){

    return escapeHTML(value);

}


/* =========================================================
   INITIAL RENDER
========================================================= */

render();

</script>
