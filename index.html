/* =========================================================
   SAVE
========================================================= */

function saveData(){

    try{

        localStorage.setItem("tb_settings",JSON.stringify(db.settings));
        localStorage.setItem("tb_services",JSON.stringify(db.services));
        localStorage.setItem("tb_products",JSON.stringify(db.products));
        localStorage.setItem("tb_users",JSON.stringify(db.users));
        localStorage.setItem("tb_orders",JSON.stringify(db.orders));
        localStorage.setItem("tb_deposits",JSON.stringify(db.deposits));

    }catch(e){

        alert(
            "Browser Storage পূর্ণ হয়ে গেছে। বড় Image থাকলে Image ছোট করে আবার চেষ্টা করুন।"
        );

        console.error(e);
    }

    const user = getCurrentUser();

    if(user){

        localStorage.setItem(
            "tb_current_user",
            JSON.stringify({id:user.id})
        );

    }else{

        localStorage.removeItem("tb_current_user");

    }
}

    return db.users.find(
        u => String(u.id) === String(db.currentUserId)

/* =========================================================
   MAIN RENDER
========================================================= */

function render(){

    const user = getCurrentUser();

    const main = document.getElementById("main-content");
    const nav = document.getElementById("bottom-nav");
    const badge = document.getElementById("user-balance-badge");
    const support = document.getElementById("floating-support");

    document.getElementById("shop-title").innerText =
        db.settings.shopName || "TOPUP BUZZ";


    document.getElementById("support-wa-btn").href =
        "https://wa.me/" + cleanNumber(db.settings.whatsappNumber);


    let tg = db.settings.telegramUsername || "";

    if(tg.startsWith("http")){

        document.getElementById("support-tg-btn").href = tg;

    }else{

        tg = tg.replace("@","");

        document.getElementById("support-tg-btn").href =
            "https://t.me/" + tg;

    }


    if(!user && db.currentTab !== "admin"){

        nav.classList.add("hide");
        badge.classList.add("hide");
        support.classList.add("hide");

        main.innerHTML = renderAuth();

        return;
    }


    if(user && db.currentTab !== "admin"){

        nav.classList.remove("hide");
        badge.classList.remove("hide");
        support.classList.remove("hide");

        document.getElementById("header-balance").innerText =
            Number(user.balance || 0).toFixed(2);

        updateNav();

    }


    if(db.currentTab === "home")
        main.innerHTML = renderHome();

    else if(db.currentTab === "deposit")
        main.innerHTML = renderDeposit();

    else if(db.currentTab === "rewards")
        main.innerHTML = renderRewards();

    else if(db.currentTab === "orders")
        main.innerHTML = renderOrders();

    else if(db.currentTab === "account")
        main.innerHTML = renderAccount();

    else if(db.currentTab === "admin"){

        nav.classList.add("hide");
        badge.classList.add("hide");
        support.classList.add("hide");

        main.innerHTML = renderAdmin();

    }

}

function updateNav(){

    ["home","deposit","rewards","orders","account"].forEach(t=>{

        const el = document.getElementById("nav-"+t);

        if(!el)return;

        el.className =
            "text-xs text-center " +
            (
                db.currentTab===t
                ?"text-indigo-600 font-bold"
                :"text-gray-500"
            );

    });

}

function toggleAuthMode(){

    db.authMode =
        db.authMode==="login"
        ?"register"
        :"login";

    render();

}


function handleAuth(){

    const phone =
        document.getElementById("auth-phone").value.trim();

    const pass =
        document.getElementById("auth-pass").value.trim();


    if(!/^01[0-9]{9}$/.test(phone)){

        alert("সঠিক ১১ সংখ্যার ফোন নম্বর দিন");

        return;
    }


    if(pass.length<6){

        alert("Password কমপক্ষে ৬ অক্ষরের হতে হবে");

        return;
    }


    if(db.authMode==="register"){

        const conf =
            document.getElementById("auth-conf-pass").value.trim();


        if(pass!==conf){

            alert("Password মিলছে না");

            return;
        }


        if(db.users.some(u=>u.phone===phone)){

            alert("এই নম্বর দিয়ে ইতিমধ্যে অ্যাকাউন্ট রয়েছে");

            return;
        }


        const user = {

            id:Date.now(),

            phone,

            password:pass,

            balance:0,

            totalSpend:0,

            createdAt:new Date().toLocaleString()

        };


        db.users.push(user);

        db.currentUserId=user.id;

        db.currentTab="home";

        saveData();

        render();


    }else{

        const user =
            db.users.find(
                u=>u.phone===phone && u.password===pass
            );


        if(!user){

            alert("নম্বর অথবা পাসওয়ার্ড ভুল হয়েছে");

            return;
        }


        db.currentUserId=user.id;

        db.currentTab="home";

        saveData();

        render();

    }

}


function logout(){

    db.currentUserId=null;

    db.currentTab="home";

    saveData();

    render();

}

function getProductImage(product){

    if(product.image)

}


function productImageHTML(product){

    const image = getProductImage(product);

    if(image){

        return `
        <img
            src="${escapeAttr(image)}"
            class="package-image"
            alt="${escapeAttr(product.name)}"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';">

        <div class="package-placeholder"
             style="display:none">
            📦
        </div>
        `;

    }

    return `
    <div class="package-placeholder">
        📦
    </div>
    `;

}

function selectService(id){

function selectProduct(id){

    db.selectedProductId=id;

    db.orderQty=1;

function clearProduct(){

    db.selectedProductId=null;

    db.orderQty=1;

    render();

}


function changeQty(value){

    db.orderQty=Math.max(1,Number(value)||1);

    const product =
        db.products.find(
            p=>Number(p.id)===Number(db.selectedProductId)
        );


    if(product){

        const total =
            Number(product.price)*db.orderQty;

        const el =
            document.getElementById("order-total");

        if(el)
            el.innerText="৳ "+total.toFixed(2);

    }

}


/* =========================================================
   ORDER SUBMIT
========================================================= */

function submitOrder(){

    const user=getCurrentUser();

    if(!user){

        alert("প্রথমে Login করুন");

        return;
    }


    const product =
        db.products.find(
            p=>Number(p.id)===Number(db.selectedProductId)
        );


    if(!product){

        alert("Product নির্বাচন করুন");

        return;
    }


    const target =
        document.getElementById("order-target").value.trim();


    if(!target){

        alert("প্রয়োজনীয় তথ্য দিন");

        return;
    }


    const quantity =
        Number(db.orderQty)||1;


    const total =
        Number(product.price)*quantity;


    if(Number(user.balance)<total){

        alert("আপনার পর্যাপ্ত Balance নেই।");

        switchTab("deposit");

        return;
    }


    user.balance =
        Number(user.balance)-total;


    user.totalSpend =
        Number(user.totalSpend||0)+total;


    const order={

        id:Date.now(),

        userId:user.id,

        userPhone:user.phone,

        serviceName:getServiceName(product.serviceId),

        productName:product.name,

        quantity,

        total,

        target,

        uid:product.inputType==="uid"?target:"",

        link:product.inputType==="link"?target:"",

        status:"Pending",

        date:new Date().toLocaleString()

    };


    db.orders.unshift(order);

    db.selectedProductId=null;

    db.orderQty=1;

    saveData();

    alert("অর্ডার সফলভাবে সাবমিট হয়েছে!");

    render();

}

function submitDeposit(){

    const amount =
        Number(document.getElementById("dep-amount").value);


    const method =
        document.getElementById("dep-method").value;


    const sender =
        document.getElementById("dep-sender").value.trim();


    const trx =
        document.getElementById("dep-trx").value.trim();


    if(!amount || amount<1){

        alert("কমপক্ষে ৳1 Deposit করতে হবে");

        return;
    }


    if(!/^01[0-9]{9}$/.test(sender)){

        alert("সঠিক Sender Number দিন");

        return;
    }


    if(!trx){

        alert("TrxID দিন");

        return;
    }


    const user=getCurrentUser();


    const deposit={

        id:Date.now(),

        userId:user.id,

        userPhone:user.phone,

        amount,

        method,

        senderNumber:sender,

        trxId:trx,

        status:"Pending",

        date:new Date().toLocaleString()

    };


    db.deposits.unshift(deposit);

    saveData();


    const msg =
        "NEW DEPOSIT\n"+
        "User: "+user.phone+"\n"+
        "Amount: ৳"+amount+"\n"+
        "Method: "+method+"\n"+
        "Sender: "+sender+"\n"+
        "TrxID: "+trx;


    window.open(
        "https://wa.me/"+
        cleanNumber(db.settings.whatsappNumber)+
        "?text="+encodeURIComponent(msg),
        "_blank"
    );


    alert("Deposit Request সফলভাবে জমা হয়েছে।");

    switchTab("deposit");

}

function renderRewards(){

    const user=getCurrentUser();

    const spend=Number(user.totalSpend||0);


    const ranks=[

        {name:"Bronze",req:100,gift:"25 Diamonds"},

        {name:"Silver",req:1000,gift:"50 Diamonds"},

        {name:"Gold",req:5000,gift:"100 Diamonds"},

        {name:"Platinum",req:10000,gift:"Weekly Lite (2x)"},

        {name:"Diamond",req:25000,gift:"Weekly Membership"},

        {name:"Heroic",req:50000,gift:"120 Diamonds"},

        {name:"Master",req:100000,gift:"Monthly Membership"},

        {name:"Grand Master",req:200000,gift:"Special VIP Reward"}

    ];


    let currentRankIndex=0;


    ranks.forEach((r,idx)=>{

        if(spend>=r.req)
            currentRankIndex=idx;

    });


    const currentRank=ranks[currentRankIndex];

    const nextRank=ranks[currentRankIndex+1];


    let progress=100;


    if(nextRank){

        const prevReq=currentRank.req;

        progress=Math.min(
            100,
            Math.max(
                0,
                ((spend-prevReq)/
                (nextRank.req-prevReq))*100
            )
        );

    }


return `

${currentRank.name}

${
nextRank
?
`

<div
class="bg-yellow-400 h-full rounded-full"
style="width:${progress}%">
</div>

</div>

<div class="text-[10px] mt-1.5 opacity-80">

Need ৳${(nextRank.req-spend).toFixed(0)}
more to unlock ${nextRank.name}

</div>

`
:
`

Max Rank Achieved! 🎉
</div>
`
}

</div>


<div class="space-y-3">

${ranks.map(r=>{

    const unlocked=spend>=r.req;

return `

</div>

`;

}).join("")}

</div>

</div>

`;

}

/* =========================================================
   IMAGE UPLOAD FOR NEW PRODUCT
========================================================= */

function previewNewProductImage(event){

    const file =
        event.target.files &&
        event.target.files[0];


    if(!file)return;


    if(!file.type.startsWith("image/")){

        alert("শুধু Image File নির্বাচন করুন");

        event.target.value="";

        return;
    }


    if(file.size>2*1024*1024){

        alert("Image 2MB-এর মধ্যে রাখুন।");

        event.target.value="";

        return;
    }


    const reader=new FileReader();


    reader.onload=function(e){

        const box =
            document.getElementById(
                "new-product-image-preview"
            );


        const img =
            document.getElementById(
                "new-product-preview-img"
            );


        img.src=e.target.result;

        box.classList.remove("hidden");

    };


    reader.readAsDataURL(file);

}


/* =========================================================
   ADD PRODUCT
========================================================= */

function addProduct(){

    const name =
        document.getElementById("product-name").value.trim();


    const price =
        Number(
            document.getElementById("product-price").value
        );


    const serviceId =
        document.getElementById("product-service").value;


    const inputType =
        document.getElementById("product-input").value;


    const category =
        document.getElementById("product-category").value.trim();


    const description =
        document.getElementById("product-description").value.trim();


    const rules =
        document.getElementById("product-rules").value.trim();


    const imageURL =
        document.getElementById("product-image").value.trim();


    const fileInput =
        document.getElementById("product-image-file");


    if(!name || !price || !serviceId){

        alert("Name, Price এবং Service দিন");

        return;
    }


    /*
       যদি URL দেওয়া হয় তাহলে URL ব্যবহার করবে।
       যদি File দেওয়া হয় তাহলে Base64 imageData সংরক্ষণ করবে।
    */

    if(fileInput && fileInput.files && fileInput.files[0]){

        const file=fileInput.files[0];


        if(!file.type.startsWith("image/")){

            alert("সঠিক Image নির্বাচন করুন");

            return;
        }


        if(file.size>2*1024*1024){

            alert("Image 2MB-এর মধ্যে রাখুন।");

            return;
        }


        const reader=new FileReader();


        reader.onload=function(e){

            db.products.push({

                id:Date.now(),

                serviceId,

                name,

                price,

                category:category||"general",

                active:true,

                inputType,

                description,

                rules,

                image:imageURL,

                imageData:e.target.result

            });


            saveData();

            alert("Product এবং Image সফলভাবে যোগ হয়েছে!");

            render();

        };


        reader.readAsDataURL(file);

        return;
    }


    db.products.push({

        id:Date.now(),

        serviceId,

        name,

        price,

        category:category||"general",

        active:true,

        inputType,

        description,

        rules,

        image:imageURL,

        imageData:""

    });


    saveData();

    alert("Product সফলভাবে যোগ হয়েছে!");

    render();

}


/* =========================================================
   EDIT PRODUCT IMAGE
========================================================= */

function editProductImage(id){

    const p =
        db.products.find(
            x=>Number(x.id)===Number(id)
        );


    if(!p)return;


    const current =
        getProductImage(p);


    const url =
        prompt(
            "Image URL দিন।\n\nবর্তমান Image URL:\n"+
            (p.image||""),
            p.image||""
        );


    if(url===null)return;


    const choice =
        confirm(
            "আপনি কি এই URL Image ব্যবহার করতে চান?\n\n"+
            "OK = URL ব্যবহার\n"+
            "Cancel = মোবাইল থেকে Image File নির্বাচন"
        );


    if(choice){

        p.image=url.trim();

        /*
           URL ব্যবহার করলে পুরোনো uploaded image সরানো হচ্ছে
        */

        p.imageData="";

        saveData();

        alert("Product Image আপডেট হয়েছে!");

        render();

        return;
    }


    /*
       Mobile File Picker
    */

    const input=document.createElement("input");

    input.type="file";

    input.accept="image/*";


    input.onchange=function(){

        const file=input.files[0];

        if(!file)return;


        if(!file.type.startsWith("image/")){

            alert("শুধু Image নির্বাচন করুন");

            return;
        }


        if(file.size>2*1024*1024){

            alert("Image 2MB-এর মধ্যে রাখুন।");

            return;
        }


        const reader=new FileReader();


        reader.onload=function(e){

            p.image="";

            p.imageData=e.target.result;

            saveData();

            alert("Product Image Upload হয়েছে!");

            render();

        };


        reader.readAsDataURL(file);

    };


    input.click();

}

/* =========================================================
   ORDER STATUS
========================================================= */

function setOrderStatus(id,status){

    const order =
        db.orders.find(
            o=>Number(o.id)===Number(id)
        );


    if(!order)return;


    order.status=status;


    if(
        status==="Cancelled" &&
        order.balanceRefunded!==true
    ){

        const user =
            db.users.find(
                u=>Number(u.id)===Number(order.userId)
            );


        if(user){

            user.balance =
                Number(user.balance||0)+
                Number(order.total||0);


            user.totalSpend =
                Math.max(
                    0,
                    Number(user.totalSpend||0)-
                    Number(order.total||0)
                );

        }


        order.balanceRefunded=true;

    }


    saveData();

    render();

}


/* =========================================================
   DEPOSIT ADMIN
========================================================= */

function approveDeposit(id){

    const d =
        db.deposits.find(
            x=>Number(x.id)===Number(id)
        );


    if(!d || d.status!=="Pending")
        return;


    const user =
        db.users.find(
            u=>Number(u.id)===Number(d.userId)
        );


    if(!user){

        alert("User পাওয়া যায়নি");

        return;
    }


    user.balance =
        Number(user.balance||0)+
        Number(d.amount||0);


    d.status="Approved";


    saveData();

    render();

}


function cancelDeposit(id){

    const d =
        db.deposits.find(
            x=>Number(x.id)===Number(id)
        );


    if(!d)return;


    d.status="Cancelled";


    saveData();

    render();

}


/* =========================================================
   ADMIN BALANCE
========================================================= */

function addBalancePrompt(userId){

    const amount =
        prompt(
            "কত টাকা Balance যোগ করবেন?"
        );


    if(amount===null)return;


    const value=Number(amount);


    if(!value || value<=0){

        alert("সঠিক Amount দিন");

        return;
    }


    const user =
        db.users.find(
            u=>Number(u.id)===Number(userId)
        );


    if(!user)return;


    user.balance =
        Number(user.balance||0)+value;


    saveData();

    render();

}

            x=>x.id===id
        );


    return s?s.name:"";

}


function cleanNumber(number){

    return String(number||"")
        .replace(/\D/g,"");

}


function escapeHTML(value){

    return String(value??"")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


function escapeAttr(value){

    return escapeHTML(value);

}
