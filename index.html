    localStorage.setItem("tb_orders", JSON.stringify(db.orders));
    localStorage.setItem("tb_deposits", JSON.stringify(db.deposits));

    const user = getCurrentUser();
    if(user){
        localStorage.setItem("tb_current_user", JSON.stringify({ id: user.id }));
    }else{
        localStorage.removeItem("tb_current_user");
    }
}

    return db.users.find(u => String(u.id) === String(db.currentUserId)) || null;

/* =========================================================

========================================================= */

function switchTab(tab){
    db.currentTab = tab;
    const container = document.getElementById("app-container");
    if(container) container.scrollTo(0, 0);
    render();
}


/* =========================================================
   RENDER ENGINE
========================================================= */

function render(){
    const user = getCurrentUser();
    const main = document.getElementById("main-content");
    const nav = document.getElementById("bottom-nav");
    const badge = document.getElementById("user-balance-badge");
    const support = document.getElementById("floating-support");

    document.getElementById("shop-title").innerText = db.settings.shopName || "TOPUP BUZZ";

    document.getElementById("support-wa-btn").href = "https://wa.me/" + cleanNumber(db.settings.whatsappNumber);

    let tg = db.settings.telegramUsername || "";
    if(tg.startsWith("http")){
        document.getElementById("support-tg-btn").href = tg;
    } else {
        tg = tg.replace("@", "");
        document.getElementById("support-tg-btn").href = "https://t.me/" + tg;
    }

    if(!user && db.currentTab !== "admin"){
        nav.classList.add("hide");
        badge.classList.add("hide");
        support.classList.add("hide");
        main.innerHTML = renderAuth();
        return;
    }

    if(user && db.currentTab !== "admin"){
        nav.classList.remove("hide");
        badge.classList.remove("hide");
        support.classList.remove("hide");
        document.getElementById("header-balance").innerText = Number(user.balance || 0).toFixed(2);
        updateNav();
    }

    if(db.currentTab === "home")
        main.innerHTML = renderHome();
    else if(db.currentTab === "deposit")
        main.innerHTML = renderDeposit();
    else if(db.currentTab === "rewards")
        main.innerHTML = renderRewards();
    else if(db.currentTab === "orders")
        main.innerHTML = renderOrders();
    else if(db.currentTab === "account")
        main.innerHTML = renderAccount();
    else if(db.currentTab === "admin"){
        nav.classList.add("hide");
        badge.classList.add("hide");
        support.classList.add("hide");
        main.innerHTML = renderAdmin();
    }
}

        if(!el) return;
        el.className = "text-xs text-center " + (db.currentTab === t ? "text-indigo-600 font-bold" : "text-gray-500");
    });
}


/* =========================================================

========================================================= */

function renderAuth(){
    return `
    <div class="py-10">
        <div class="card p-6 shadow-sm">
            <div class="text-center">
                <div class="w-16 h-16 bg-indigo-600 text-white rounded-2xl mx-auto flex items-center justify-center text-3xl font-bold shadow mb-3">
                    TB
                </div>
                <h2 class="text-2xl font-bold text-indigo-700">
                    ${escapeHTML(db.settings.shopName)}
                </h2>
                <p class="text-gray-500 text-sm mt-1">
                    ${db.authMode === "login" ? "Customer Login" : "Create New Account"}
                </p>
            </div>

            <div class="mt-6 space-y-3">
                <input type="text" id="auth-phone" placeholder="01XXXXXXXXX" class="w-full border rounded-xl p-3 text-sm">
                <input type="password" id="auth-pass" placeholder="Password" class="w-full border rounded-xl p-3 text-sm">
                ${db.authMode === "register" ? `<input type="password" id="auth-conf-pass" placeholder="Confirm Password" class="w-full border rounded-xl p-3 text-sm">` : ""}

                <button onclick="handleAuth()" class="w-full bg-indigo-600 text-white font-bold py-3 rounded-xl text-sm">
                    ${db.authMode === "login" ? "Login" : "Register"}
                </button>

                <button onclick="toggleAuthMode()" class="w-full text-indigo-600 text-xs py-2">
                    ${db.authMode === "login" ? "Create New Account" : "Already have account? Login"}
                </button>
            </div>
        </div>
    </div>`;
}

function toggleAuthMode(){
    db.authMode = db.authMode === "login" ? "register" : "login";
    render();
}

function handleAuth(){
    const phone = document.getElementById("auth-phone").value.trim();
    const pass = document.getElementById("auth-pass").value.trim();

    if(!/^01[0-9]{9}$/.test(phone)){
        alert("সঠিক ১১ সংখ্যার ফোন নম্বর দিন");
        return;
    }
    if(pass.length < 6){
        alert("Password কমপক্ষে ৬ অক্ষরের হতে হবে");
        return;
    }

    if(db.authMode === "register"){
        const conf = document.getElementById("auth-conf-pass").value.trim();
        if(pass !== conf){
            alert("Password মিলছে না");
            return;
        }
        if(db.users.some(u => u.phone === phone)){
            alert("এই নম্বর দিয়ে ইতিমধ্যে অ্যাকাউন্ট রয়েছে");
            return;
        }

        const user = {
            id: Date.now(),
            phone: phone,
            password: pass,
            balance: 0,
            totalSpend: 0,
            createdAt: new Date().toLocaleString()
        };

        db.users.push(user);
        db.currentUserId = user.id;
        db.currentTab = "home";
        saveData();
        render();
    } else {
        const user = db.users.find(u => u.phone === phone && u.password === pass);
        if(!user){
            alert("নম্বর অথবা পাসওয়ার্ড ভুল হয়েছে");
            return;
        }
        db.currentUserId = user.id;
        db.currentTab = "home";
        saveData();
        render();
    }
}

function logout(){
    db.currentUserId = null;
    db.currentTab = "home";
    saveData();
    render();
}


/* =========================================================
   HOME PAGE
========================================================= */

function renderHome(){

    const services = db.services.filter(s => s.active !== false);
    const selectedService = db.services.find(s => s.id === db.selectedService);
    const products = db.products.filter(p => p.serviceId === db.selectedService && p.active !== false);
    const selected = db.products.find(p => Number(p.id) === Number(db.selectedProductId));
    const total = selected ? Number(selected.price) * Number(db.orderQty) : 0;

    return `
    <div>
        <!-- HERO BANNER -->
        <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white rounded-2xl p-4 mb-4 shadow">
            <p class="text-[11px] opacity-80">Welcome</p>
            <h2 class="text-lg font-bold mt-1">${escapeHTML(db.settings.shopName)}</h2>
            <p class="text-xs mt-1 opacity-90">${escapeHTML(db.settings.notice)}</p>
        </div>

        <!-- SERVICES GRID (Unlimited Services Support) -->
        <h2 class="font-bold text-sm mb-2">🛍️ Services</h2>
        <div class="grid grid-cols-4 gap-2 mb-4 max-h-[320px] overflow-y-auto no-scrollbar pr-1">
            ${services.map(s => `
                <button onclick="selectService('${escapeAttr(s.id)}')"
                    class="bg-white border rounded-2xl p-2.5 text-center shadow-sm ${db.selectedService === s.id ? "border-indigo-600 ring-2 ring-indigo-100 bg-indigo-50/50" : ""}">
                    <div class="service-icon mx-auto bg-gray-100 text-lg">
                        ${s.image ? `<img src="${s.image}" alt="">` : (s.icon || "🛍️")}
                    </div>
                    <div class="font-bold text-[10px] mt-1.5 truncate">
                        ${escapeHTML(s.name)}
                    </div>
                </button>
            `).join("")}
        </div>

        <!-- SERVICE DESCRIPTION -->
        ${selectedService ? `
            <div class="bg-indigo-50 rounded-xl p-3 mb-4 border border-indigo-100">
                <div class="font-bold text-xs text-indigo-900">${escapeHTML(selectedService.name)}</div>
                <div class="text-[10px] text-gray-600 mt-1">${escapeHTML(selectedService.description || "")}</div>
            </div>
        ` : ""}

        <!-- PRODUCTS GRID -->
        <h2 class="font-bold text-sm mb-2">📦 Products</h2>
        ${products.length === 0 ? `
            <div class="card text-center py-10 text-gray-400 text-xs">
                এই Service-এ এখনো কোনো Product নেই।
            </div>
        ` : `
            <div class="grid grid-cols-2 gap-2.5">
                ${products.map(p => `
                    <button onclick="selectProduct(${Number(p.id)})"
                        class="package-card text-left bg-white border rounded-xl p-3 shadow-sm ${Number(db.selectedProductId) === Number(p.id) ? "border-indigo-600 ring-2 ring-indigo-100 bg-indigo-50" : ""}">

                        <div class="text-indigo-600 font-bold text-sm mt-2">৳ ${Number(p.price).toFixed(2)}</div>
                        <div class="text-[9px] text-gray-400 mt-1">Tap for details</div>
                    </button>
                `).join("")}
            </div>
        `}

        ${selected ? renderOrderBox(selected, total) : ""}
    </div>`;
}

            ${Array.from({length:100},(_,i)=>i+1).map(n=>`<option value="${n}" ${db.orderQty===n?"selected":""}>${n} টি</option>`).join("")}
        </select>

        <label class="text-[11px] font-bold text-gray-600">${inputLabel}</label>
        <input type="text" id="order-target" placeholder="${placeholder}" class="w-full border rounded-xl p-2.5 text-xs mt-1 mb-3">

        <div class="bg-indigo-50 p-3 rounded-xl flex justify-between items-center mb-3">
            <span class="text-xs font-bold">মোট খরচ</span>

function selectService(id){
    db.selectedService = id;
    db.selectedProductId = null;
    db.orderQty = 1;
    render();
}

function selectProduct(id){
    db.selectedProductId = id;
    db.orderQty = 1;
    render();
}

function clearProduct(){
    db.selectedProductId = null;
    db.orderQty = 1;
    render();
}

function changeQty(value){
    db.orderQty = Math.max(1, Number(value) || 1);
    const product = db.products.find(p => Number(p.id) === Number(db.selectedProductId));
    if(product){
        const total = Number(product.price) * db.orderQty;
        const el = document.getElementById("order-total");
        if(el) el.innerText = "৳ " + total.toFixed(2);
    }
}

function submitOrder(){
    const user = getCurrentUser();
    if(!user){
        alert("প্রথমে Login করুন");
        return;
    }
    const product = db.products.find(p => Number(p.id) === Number(db.selectedProductId));
    if(!product){
        alert("Product নির্বাচন করুন");
        return;
    }
    const target = document.getElementById("order-target").value.trim();
    if(!target){
        alert("প্রয়োজনীয় তথ্য দিন");
        return;
    }

    const quantity = Number(db.orderQty) || 1;
    const total = Number(product.price) * quantity;

    if(Number(user.balance) < total){
        alert("আপনার পর্যাপ্ত Balance নেই।");
        switchTab("deposit");
        return;
    }

    user.balance = Number(user.balance) - total;
    user.totalSpend = Number(user.totalSpend || 0) + total;

    const order = {
        id: Date.now(),
        userId: user.id,
        userPhone: user.phone,
        serviceName: getServiceName(product.serviceId),
        productName: product.name,
        quantity: quantity,
        total: total,
        target: target,
        uid: product.inputType === "uid" ? target : "",
        link: product.inputType === "link" ? target : "",
        status: "Pending",
        date: new Date().toLocaleString()
    };

    db.orders.unshift(order);
    db.selectedProductId = null;
    db.orderQty = 1;
    saveData();
    alert("অর্ডার সফলভাবে সাবমিট হয়েছে!");
    render();
}

function submitDeposit(){
    const amount = Number(document.getElementById("dep-amount").value);
    const method = document.getElementById("dep-method").value;
    const sender = document.getElementById("dep-sender").value.trim();
    const trx = document.getElementById("dep-trx").value.trim();

    if(!amount || amount < 1){
        alert("কমপক্ষে ৳1 Deposit করতে হবে");
        return;
    }
    if(!/^01[0-9]{9}$/.test(sender)){
        alert("সঠিক Sender Number দিন");
        return;
    }
    if(!trx){
        alert("TrxID দিন");
        return;
    }

    const user = getCurrentUser();
    const deposit = {
        id: Date.now(),
        userId: user.id,
        userPhone: user.phone,
        amount: amount,
        method: method,
        senderNumber: sender,
        trxId: trx,
        status: "Pending",
        date: new Date().toLocaleString()
    };

    db.deposits.unshift(deposit);
    saveData();

    const msg = "NEW DEPOSIT\nUser: " + user.phone + "\nAmount: ৳" + amount + "\nMethod: " + method + "\nSender: " + sender + "\nTrxID: " + trx;
    window.open("https://wa.me/" + cleanNumber(db.settings.whatsappNumber) + "?text=" + encodeURIComponent(msg), "_blank");

    alert("Deposit Request সফলভাবে জমা হয়েছে।");
    switchTab("deposit");
}


/* =========================================================
   REWARDS & RANKS
========================================================= */

function renderRewards(){
    const user = getCurrentUser();
    const spend = Number(user.totalSpend || 0);

    const ranks = [
        { name: "Bronze", req: 100, gift: "25 Diamonds" },
        { name: "Silver", req: 1000, gift: "50 Diamonds" },
        { name: "Gold", req: 5000, gift: "100 Diamonds" },
        { name: "Platinum", req: 10000, gift: "Weekly Lite (2x)" },
        { name: "Diamond", req: 25000, gift: "Weekly Membership" },
        { name: "Heroic", req: 50000, gift: "120 Diamonds" },
        { name: "Master", req: 100000, gift: "Monthly Membership" },
        { name: "Grand Master", req: 200000, gift: "Special VIP Reward" }
    ];

    let currentRankIndex = 0;
    ranks.forEach((r, idx) => {
        if(spend >= r.req) currentRankIndex = idx;
    });
    const currentRank = ranks[currentRankIndex];
    const nextRank = ranks[currentRankIndex + 1];
    
    let progress = 100;
    if(nextRank){
        const prevReq = currentRank.req;
        progress = Math.min(100, Math.max(0, ((spend - prevReq) / (nextRank.req - prevReq)) * 100));
    }

    return `
    <div>
        <h2 class="text-base font-bold mb-3">🏆 Rewards & Ranks</h2>

        <div class="bg-gradient-to-r from-indigo-600 to-purple-700 text-white rounded-2xl p-4 mb-4 shadow">
            <div class="text-xs opacity-80">CURRENT RANK</div>
            <div class="text-xl font-bold mt-1">${currentRank.name}</div>
            <div class="text-xs mt-1 opacity-90">Total Spend: ৳${spend.toFixed(2)}</div>
            ${nextRank ? `
                <div class="mt-3 bg-white/20 rounded-full h-2 overflow-hidden">
                    <div class="bg-yellow-400 h-full rounded-full" style="width: ${progress}%"></div>
                </div>
                <div class="text-[10px] mt-1.5 opacity-80">Need ৳${(nextRank.req - spend).toFixed(0)} more to unlock ${nextRank.name}</div>
            ` : `<div class="text-[10px] mt-2 text-yellow-300 font-bold">Max Rank Achieved! 🎉</div>`}
        </div>

        <div class="space-y-3">
            ${ranks.map(r => {
                const unlocked = spend >= r.req;
                return `
                <div class="card p-4 flex justify-between items-center">
                    <div>
                        <h3 class="font-bold text-xs">${r.name}</h3>
                        <p class="text-[10px] text-gray-500">Requirement: ৳${r.req}</p>
                        <p class="text-[10px] text-indigo-600 font-bold mt-1">🎁 Gift: ${r.gift}</p>
                    </div>
                    <span class="text-[10px] font-bold px-3 py-1 rounded-full ${unlocked ? "bg-green-100 text-green-700" : "bg-gray-100 text-gray-500"}">
                        ${unlocked ? "Unlocked" : "Locked"}
                    </span>
                </div>`;
            }).join("")}
        </div>
    </div>`;
}

                        <button onclick="deleteProduct(${Number(p.id)})" class="bg-red-500 text-white px-2 py-1 rounded text-[10px]">Delete</button>
                    </div>
                </div>
            `).join("")}
        </div>`;
    }

    if(db.adminSection === "orders"){
        return `
        <div class="space-y-2">
            ${db.orders.length === 0 ? `<div class="text-center text-gray-400 text-xs py-10">কোনো Order নেই।</div>` : db.orders.map(o => `
                <div class="card p-3 text-xs">
                    <div class="font-bold">${escapeHTML(o.productName || "Product")}</div>
                    <div class="text-indigo-600 font-bold">৳${Number(o.total).toFixed(2)}</div>
                    <div class="text-[10px] text-gray-600">User: ${escapeHTML(o.userPhone)}</div>
                    <div class="text-[10px] text-gray-600 break-all">Target: ${escapeHTML(o.target || o.uid || o.link || "")}</div>
                    <div class="text-[10px] text-gray-400">${escapeHTML(o.date)}</div>
                    <div class="flex gap-1 mt-2">
                        <button onclick="setOrderStatus(${Number(o.id)},'Pending')" class="bg-yellow-500 text-white px-2 py-1 rounded text-[10px]">Pending</button>
                        <button onclick="setOrderStatus(${Number(o.id)},'Complete')" class="bg-green-600 text-white px-2 py-1 rounded text-[10px]">Complete</button>
                        <button onclick="setOrderStatus(${Number(o.id)},'Cancelled')" class="bg-red-500 text-white px-2 py-1 rounded text-[10px]">Cancel</button>
                    </div>
                </div>
            `).join("")}
        </div>`;
    }

    if(db.adminSection === "deposits"){
        return `
        <div class="space-y-2">
            ${db.deposits.length === 0 ? `<div class="text-center text-gray-400 text-xs py-10">কোনো Deposit নেই।</div>` : db.deposits.map(d => `
                <div class="card p-3 text-xs">
                    <div class="font-bold">${escapeHTML(d.userPhone)}</div>
                    <div class="text-indigo-600 font-bold">৳${Number(d.amount).toFixed(2)}</div>
                    <div class="text-[10px]">Method: ${escapeHTML(d.method)}</div>
                    <div class="text-[10px]">Sender: ${escapeHTML(d.senderNumber)}</div>
                    <div class="text-[10px]">TrxID: ${escapeHTML(d.trxId)}</div>
                    ${d.status === "Pending" ? `
                        <div class="flex gap-2 mt-2">
                            <button onclick="approveDeposit(${Number(d.id)})" class="bg-green-600 text-white px-3 py-1 rounded text-[10px]">Approve</button>
                            <button onclick="cancelDeposit(${Number(d.id)})" class="bg-red-500 text-white px-3 py-1 rounded text-[10px]">Cancel</button>
                        </div>
                    ` : `<div class="mt-2 text-[10px] font-bold">Status: ${escapeHTML(d.status)}</div>`}
                </div>
            `).join("")}
        </div>`;
    }

    if(db.adminSection === "customers"){
        return `
        <div class="space-y-2">
            ${db.users.length === 0 ? `<div class="text-center text-gray-400 text-xs py-10">কোনো Customer নেই।</div>` : db.users.map(u => `
                <div class="card p-3 flex justify-between items-center text-xs">
                    <div>
                        <div class="font-bold">${escapeHTML(u.phone)}</div>
                        <div class="text-indigo-600">Balance: ৳${Number(u.balance || 0).toFixed(2)}</div>
                        <div class="text-[10px] text-gray-500">Spend: ৳${Number(u.totalSpend || 0).toFixed(2)}</div>
                    </div>
                    <button onclick="addBalancePrompt(${Number(u.id)})" class="bg-indigo-600 text-white px-2 py-1 rounded text-[10px]">Add Balance</button>
                </div>
            `).join("")}
        </div>`;
    }

    if(db.adminSection === "settings"){
        return `
        <div class="card p-3 text-xs space-y-2">
            <div class="font-bold text-sm">⚙️ Website Settings</div>
            <label>Shop Name</label>
            <input id="set-name" value="${escapeAttr(db.settings.shopName || "")}" class="w-full border p-2 rounded">
            <label>Payment Number</label>
            <input id="set-pay" value="${escapeAttr(db.settings.paymentNumber || "")}" class="w-full border p-2 rounded">
            <label>WhatsApp Number</label>
            <input id="set-wa" value="${escapeAttr(db.settings.whatsappNumber || "")}" class="w-full border p-2 rounded">
            <label>Telegram Username / Link</label>
            <input id="set-tg" value="${escapeAttr(db.settings.telegramUsername || "")}" class="w-full border p-2 rounded">
            <label>Notice</label>
            <textarea id="set-notice" class="w-full border p-2 rounded">${escapeHTML(db.settings.notice || "")}</textarea>
            <button onclick="saveSettings()" class="w-full bg-indigo-600 text-white py-2.5 rounded font-bold">Save Changes</button>
        </div>`;
    }

    return "";
}


/* =========================================================
   ADMIN ACTIONS
========================================================= */

function addService(){
    const name = document.getElementById("service-name").value.trim();
    const icon = document.getElementById("service-icon").value.trim() || "🛍️";
    const description = document.getElementById("service-desc").value.trim();
    const fileInput = document.getElementById("service-img-file");

    if(!name){ alert("Service Name দিন"); return; }

    const id = "service_" + Date.now();

    if(fileInput.files && fileInput.files[0]){
        const reader = new FileReader();
        reader.onload = function(e){
            db.services.push({ id, name, icon, image: e.target.result, type: "custom", active: true, description });
            saveData();
            render();
        };
        reader.readAsDataURL(fileInput.files[0]);
    } else {
        db.services.push({ id, name, icon, image: "", type: "custom", active: true, description });
        saveData();
        render();
    }
}

function editService(id){
    const s = db.services.find(x => x.id === id);
    if(!s) return;
    const name = prompt("Service Name:", s.name);
    if(name === null) return;
    const icon = prompt("Icon / Emoji:", s.icon || "🛍️");
    if(icon === null) return;
    const description = prompt("Description:", s.description || "");
    if(description === null) return;

    s.name = name.trim();
    s.icon = icon.trim() || "🛍️";
    s.description = description.trim();

    const changeImg = confirm("গ্যালারি থেকে নতুন ছবি আপলোড করতে চান?");
    if(changeImg){
        const input = document.createElement("input");
        input.type = "file";
        input.accept = "image/*";
        input.onchange = e => {
            const file = e.target.files[0];
            if(file){
                const reader = new FileReader();
                reader.onload = event => {
                    s.image = event.target.result;
                    saveData();
                    render();
                };
                reader.readAsDataURL(file);
            }
        };
        input.click();
    } else {
        saveData();
        render();
    }
}

function toggleService(id){
    const s = db.services.find(x => x.id === id);
    if(!s) return;
    s.active = s.active === false;
    saveData();
    render();
}

function deleteService(id){
    if(!confirm("এই Service এবং এর Product মুছে ফেলবেন?")) return;
    db.services = db.services.filter(s => s.id !== id);
    db.products = db.products.filter(p => p.serviceId !== id);
    saveData();
    render();
}

function addProduct(){
    const name = document.getElementById("product-name").value.trim();
    const price = Number(document.getElementById("product-price").value);
    const serviceId = document.getElementById("product-service").value;
    const inputType = document.getElementById("product-input").value;
    const category = document.getElementById("product-category").value.trim();
    const description = document.getElementById("product-description").value.trim();
    const rules = document.getElementById("product-rules").value.trim();

    if(!name || !price || !serviceId){ alert("Name, Price এবং Service দিন"); return; }

    db.products.push({
        id: Date.now(),
        serviceId,
        name,
        price,
        category: category || "general",
        active: true,
        inputType,
        description,
        rules
    });
    saveData();
    render();
}

function editProduct(id){
    const p = db.products.find(x => Number(x.id) === Number(id));
    if(!p) return;
    const name = prompt("Product Name:", p.name);
    if(name === null) return;
    const price = prompt("Price:", p.price);
    if(price === null) return;

    p.name = name.trim();
    p.price = Number(price) || p.price;
    saveData();
    render();
}

function toggleProduct(id){
    const p = db.products.find(x => Number(x.id) === Number(id));
    if(!p) return;
    p.active = p.active === false;
    saveData();
    render();
}

function deleteProduct(id){
    if(!confirm("Product টি Delete করবেন?")) return;
    db.products = db.products.filter(p => Number(p.id) !== Number(id));
    saveData();
    render();
}

function setOrderStatus(id, status){
    const order = db.orders.find(o => Number(o.id) === Number(id));
    if(!order) return;
    order.status = status;

    if(status === "Cancelled" && order.balanceRefunded !== true){
        const user = db.users.find(u => Number(u.id) === Number(order.userId));
        if(user){
            user.balance = Number(user.balance || 0) + Number(order.total || 0);
            user.totalSpend = Math.max(0, Number(user.totalSpend || 0) - Number(order.total || 0));
        }
        order.balanceRefunded = true;
    }
    saveData();
    render();
}

function approveDeposit(id){
    const d = db.deposits.find(x => Number(x.id) === Number(id));
    if(!d || d.status !== "Pending") return;
    const user = db.users.find(u => Number(u.id) === Number(d.userId));
    if(!user){ alert("User পাওয়া যায়নি"); return; }

    user.balance = Number(user.balance || 0) + Number(d.amount || 0);
    d.status = "Approved";
    saveData();
    render();
}

function cancelDeposit(id){
    const d = db.deposits.find(x => Number(x.id) === Number(id));
    if(!d) return;
    d.status = "Cancelled";
    saveData();
    render();
}

function addBalancePrompt(userId){
    const amount = prompt("কত টাকা Balance যোগ করবেন?");
    if(amount === null) return;
    const value = Number(amount);
    if(!value || value <= 0){ alert("সঠিক Amount দিন"); return; }

    const user = db.users.find(u => Number(u.id) === Number(userId));
    if(!user) return;
    user.balance = Number(user.balance || 0) + value;
    saveData();
    render();
}

function saveSettings(){
    db.settings.shopName = document.getElementById("set-name").value.trim();
    db.settings.paymentNumber = document.getElementById("set-pay").value.trim();
    db.settings.whatsappNumber = document.getElementById("set-wa").value.trim();
    db.settings.telegramUsername = document.getElementById("set-tg").value.trim();
    db.settings.notice = document.getElementById("set-notice").value.trim();
    saveData();
    alert("Settings সংরক্ষিত হয়েছে!");
    render();
}

function getServiceName(id){
    const s = db.services.find(x => x.id === id);
    return s ? s.name : "";
}

function cleanNumber(number){
    return String(number || "").replace(/\D/g,"");
}

function escapeHTML(value){
    return String(value ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}

function escapeAttr(value){
    return escapeHTML(value);
}

render();

</script>
