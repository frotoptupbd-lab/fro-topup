<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOPUP BUZZ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .app-container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .no-scrollbar {
            scrollbar-width: none;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .header {
            background: #ffffff;
            padding: 15px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #000;
        }
        .balance-card {
            background: #fff;
            padding: 15px;
            margin: 10px;
            border-radius: 8px;
            border: 1px solid #ddd;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .section-title {
            padding: 0 15px;
            margin: 15px 0 10px 0;
            font-size: 16px;
            font-weight: bold;
        }
        .services-grid, .products-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            padding: 0 15px;
        }
        .item-card {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px 5px;
            text-align: center;
            font-size: 12px;
        }
        .bottom-nav {
            margin-top: auto;
            background: #fff;
            border-top: 1px solid #ddd;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }
        .nav-item {
            text-align: center;
            font-size: 11px;
            color: #555;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="app-container no-scrollbar">
        <div class="header">
            <div class="logo">TOPUP BUZZ</div>
            <button style="padding: 5px 10px; font-size: 12px;">Admin</button>
        </div>

        <div class="balance-card">
            <div>
                <small>Balance</small>
                <div style="font-size: 18px; font-weight: bold;">৳ 10000.00</div>
            </div>
        </div>

        <div class="section-title">📦 Services</div>
        <div class="services-grid">
            <div class="item-card">Free Fire</div>
            <div class="item-card">Facebook</div>
            <div class="item-card">TikTok</div>
            <div class="item-card">YouTube</div>
        </div>

        <div class="section-title">🔥 Packages / Products</div>
        <div class="products-grid" style="grid-template-columns: repeat(3, 1fr);">
            <div class="item-card">25 Diamonds<br><b>৳ 26.00</b></div>
            <div class="item-card">50 Diamonds<br><b>৳ 50.00</b></div>
            <div class="item-card">70 Diamonds<br><b>৳ 70.00</b></div>
            <div class="item-card">Weekly Lite<br><b>৳ 165.00</b></div>
            <div class="item-card">Weekly Mem.<br><b>৳ 165.00</b></div>
            <div class="item-card">Monthly Mem.<br><b>৳ 810.00</b></div>
        </div>

        <div class="bottom-nav">
            <a href="#" class="nav-item">🏠<br>Home</a>
            <a href="#" class="nav-item">➕<br>Add Money</a>
            <a href="#" class="nav-item">🎁<br>Rewards</a>
            <a href="#" class="nav-item">📦<br>My Orders</a>
            <a href="#" class="nav-item">👤<br>Account</a>
        </div>
    </div>

</body>
</html>
